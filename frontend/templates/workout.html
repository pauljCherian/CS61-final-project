<!DOCTYPE html>
<!-- Assisted with Claude Code Opus 4.8-->
<html>
<head>
    <title>Workout</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a class="home-btn" href="/">Home</a>
        <main class="container" data-workout-id="{{ workout_id }}">
        <h1>Workout</h1>

        <div class="field-row">
            <input type="date" name="workout_date" value="{{ workout.WorkoutDate }}" onblur="saveWorkout()">
            <input name="workout_description" placeholder="description" value="{{ workout.Description or '' }}" onblur="saveWorkout()">
            <input name="workout_notes" placeholder="notes" value="{{ workout.Notes or '' }}" onblur="saveWorkout()">
        </div>

        <div id="lifts">
            {% for lift in lifts %}
            <div class="lift" data-we-id="{{ lift.WorkoutExerciseID }}">
                <h2>Lift</h2>

                <div class="lift-header">
                    <input name="lift_name" placeholder="exercise name" value="{{ lift.ExerciseName }}" onblur="saveLift(this)">
                    <input name="lift_notes" placeholder="notes (optional)" value="{{ lift.Notes or '' }}" onblur="saveLift(this)">
                    <button type="button" onclick="deleteLift(this)">Delete Lift</button>
                </div>

                <div class="sets">
                    {% for s in lift.sets %}
                    <div class="set" data-set-id="{{ s.SetID }}">
                        <input name="weight" placeholder="weight" value="{{ s.Weight or '' }}" onblur="saveSet(this)">
                        <input name="reps" placeholder="reps" value="{{ s.Reps or '' }}" onblur="saveSet(this)">
                        <input name="rpe" placeholder="rpe" value="{{ s.RPE or '' }}" onblur="saveSet(this)">
                        <button type="button" onclick="deleteSet(this)">x</button>
                    </div>
                    {% endfor %}
                </div>

                <button type="button" class="add-set" onclick="addSet(this)">Add Set</button>

                <hr>
            </div>
            {% endfor %}
        </div>
        <button type="button" onclick="addLift()">Add Lift</button>

        <hr>

        <h2>Cardio</h2>
        <div id="cardio-sessions">
            {% for c in cardio %}
            <div class="cardio" data-cardio-id="{{ c.CardioID }}">
                <div class="cardio-header">
                    <input name="cardio_type" placeholder="activity (e.g. Running)" value="{{ c.ActivityType or '' }}" onblur="saveCardio(this)">
                    <input name="cardio_notes" placeholder="notes (e.g. 4x400m)" value="{{ c.Notes or '' }}" onblur="saveCardio(this)">
                    <button type="button" onclick="deleteCardio(this)">Delete Cardio</button>
                </div>

                <div class="cardio-stats">
                    <input name="cardio_time" placeholder="HH:MM:SS" value="{{ c.Duration or '' }}" onblur="saveCardio(this)">
                    <input name="cardio_distance" placeholder="distance" value="{{ c.Distance or '' }}" onblur="saveCardio(this)">
                    <label>Unit
                        <select name="cardio_unit" onchange="saveCardio(this)">
                            {% for u in ["mi","km","m"] %}
                            <option value="{{ u }}" {% if c.Units == u %}selected{% endif %}>{{ u }}</option>
                            {% endfor %}
                        </select>
                    </label>
                    <label>Intensity
                        <select name="cardio_intensity" onchange="saveCardio(this)">
                            <option value="">-</option>
                            {% for i in [1, 2, 3, 4, 5] %}
                            <option value="{{ i }}" {% if c.Intensity == i %}selected{% endif %}>{{ i }}</option>
                            {% endfor %}
                        </select>
                    </label>
                </div>

                <hr>
            </div>
            {% endfor %}
        </div>
        <button type="button" onclick="addCardio()">Add Cardio</button>
    </main>

    <template id="lift-template">
        <div class="lift" data-we-id="">
            <h2>Lift</h2>

            <div class="lift-header">
                <input name="lift_name" placeholder="exercise name" onblur="saveLift(this)">
                <input name="lift_notes" placeholder="notes (optional)" onblur="saveLift(this)">
                <button type="button" onclick="deleteLift(this)">Delete Lift</button>
            </div>

            <div class="sets"></div>

            <button type="button" class="add-set" onclick="addSet(this)" disabled>Add Set</button>

            <hr>
        </div>
    </template>

    <template id="set-template">
        <div class="set" data-set-id="">
            <input name="weight" placeholder="weight" onblur="saveSet(this)">
            <input name="reps" placeholder="reps" onblur="saveSet(this)">
            <input name="rpe" placeholder="rpe" onblur="saveSet(this)">
            <button type="button" onclick="deleteSet(this)">x</button>
        </div>
    </template>

    <template id="cardio-template">
        <div class="cardio" data-cardio-id="">
            <div class="cardio-header">
                <input name="cardio_type" placeholder="activity (e.g. Running)" onblur="saveCardio(this)">
                <input name="cardio_notes" placeholder="notes (e.g. 4x400m)" onblur="saveCardio(this)">
                <button type="button" onclick="deleteCardio(this)">Delete Cardio</button>
            </div>

            <div class="cardio-stats">
                <input name="cardio_time" placeholder="HH:MM:SS" onblur="saveCardio(this)">
                <input name="cardio_distance" placeholder="distance" onblur="saveCardio(this)">
                <label>Unit
                    <select name="cardio_unit" onchange="saveCardio(this)">
                        <option value="mi">mi</option>
                        <option value="km">km</option>
                        <option value="m">m</option>
                    </select>
                </label>
                <label>Intensity
                    <select name="cardio_intensity" onchange="saveCardio(this)">
                        <option value="">-</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </label>
            </div>

            <hr>
        </div>
    </template>

    <script>
        // Used Claude Code Opus 4.8 to write the scripts - not comfortable with JS
        // Which workout these lifts/sets belong to (read from <main data-workout-id>).
        const WORKOUT_ID = document.querySelector(".container").dataset.workoutId;

        // ---- shared fetch helper: calls our app.py proxy routes (same origin) ----
        async function api(method, url, body) {
            const opts = { method, headers: {} };
            if (body !== undefined) {
                opts.headers["Content-Type"] = "application/json";
                opts.body = JSON.stringify(body);
            }
            const res = await fetch(url, opts);
            if (!res.ok) { console.error(method, url, res.status); return null; }
            return res.status === 204 ? {} : res.json();  // deletes have no body
        }

        // ---------------- workout (date / description / notes) ----------------

        async function saveWorkout() {
            await api("PUT", `/workout/${WORKOUT_ID}`, {
                date: document.querySelector("[name=workout_date]").value,
                description: document.querySelector("[name=workout_description]").value,
                notes: document.querySelector("[name=workout_notes]").value,
            });
        }

        // ---------------- lifts ----------------

        // Just drops a blank lift card on the page. No server call yet:
        // a lift can't exist until it has an exercise name.
        function addLift() {
            const template = document.getElementById("lift-template");
            const copy = template.content.cloneNode(true);
            document.getElementById("lifts").appendChild(copy);

            // focus the name input of the card we just added
            const cards = document.querySelectorAll(".lift");
            cards[cards.length - 1].querySelector("[name=lift_name]").focus();
        }

        // Fires on blur of the name OR notes input.
        // First time (no we-id) -> CREATE. After that -> UPDATE.
        async function saveLift(input) {
            const card  = input.closest(".lift");
            const name  = card.querySelector("[name=lift_name]").value.trim();
            const notes = card.querySelector("[name=lift_notes]").value.trim();

            if (!name) return;                            // nothing to save without a name
            if (card.dataset.weId === "pending") return;  // a create is already in flight

            if (!card.dataset.weId) {
                // CREATE
                card.dataset.weId = "pending";            // guard against a double-create
                const order = [...document.querySelectorAll(".lift")].indexOf(card) + 1;
                const res = await api("POST", `/workout/${WORKOUT_ID}/lifts`, { name, notes, order });
                if (!res) { card.dataset.weId = ""; return; }   // failed: allow a retry
                card.dataset.weId = res.we_id;            // remember the server id
                card.querySelector(".add-set").disabled = false;  // sets can attach now
            } else {
                // UPDATE
                await api("PUT", `/lifts/${card.dataset.weId}`, { name, notes });
            }
        }

        async function deleteLift(button) {
            const card = button.closest(".lift");
            if (card.dataset.weId && card.dataset.weId !== "pending") {
                const res = await api("DELETE", `/lifts/${card.dataset.weId}`);
                if (!res) return;                         // leave it on screen if delete failed
            }
            card.remove();
        }

        // ---------------- sets ----------------

        // Creates a blank set on the server first, then draws the row with its id.
        async function addSet(button) {
            const card    = button.closest(".lift");
            const setsDiv = card.querySelector(".sets");
            const setNum  = setsDiv.querySelectorAll(".set").length + 1;

            const res = await api("POST", `/lifts/${card.dataset.weId}/sets`, { set_num: setNum });
            if (!res) return;

            const copy = document.getElementById("set-template").content.cloneNode(true);
            copy.querySelector(".set").dataset.setId = res.set_id;  // stamp id before it's on the page
            setsDiv.appendChild(copy);
        }

        // Fires on blur of any set field. Sends all three values for that set.
        async function saveSet(input) {
            const row = input.closest(".set");
            await api("PUT", `/sets/${row.dataset.setId}`, {
                weight: row.querySelector("[name=weight]").value || null,
                reps:   row.querySelector("[name=reps]").value || null,
                rpe:    row.querySelector("[name=rpe]").value || null,
            });
        }

        async function deleteSet(button) {
            const row = button.closest(".set");
            if (row.dataset.setId) {
                const res = await api("DELETE", `/sets/${row.dataset.setId}`);
                if (!res) return;
            }
            row.remove();
        }

        // ---------------- cardio ----------------

        // Creates a blank cardio session on the server first, then draws it with its id.
        async function addCardio() {
            const res = await api("POST", `/workout/${WORKOUT_ID}/cardio`);
            if (!res) return;

            const copy = document.getElementById("cardio-template").content.cloneNode(true);
            copy.querySelector(".cardio").dataset.cardioId = res.cardio_id;
            document.getElementById("cardio-sessions").appendChild(copy);
        }

        // Fires on blur/change of any cardio field. Sends the whole session.
        async function saveCardio(el) {
            const card = el.closest(".cardio");
            await api("PUT", `/cardio/${card.dataset.cardioId}`, {
                type:      card.querySelector("[name=cardio_type]").value || null,
                notes:     card.querySelector("[name=cardio_notes]").value || null,
                time:      card.querySelector("[name=cardio_time]").value || null,
                distance:  card.querySelector("[name=cardio_distance]").value || null,
                unit:      card.querySelector("[name=cardio_unit]").value || null,
                intensity: card.querySelector("[name=cardio_intensity]").value || null,
            });
        }

        async function deleteCardio(button) {
            const card = button.closest(".cardio");
            if (card.dataset.cardioId) {
                const res = await api("DELETE", `/cardio/${card.dataset.cardioId}`);
                if (!res) return;
            }
            card.remove();
        }
    </script>
</body>
</html>
